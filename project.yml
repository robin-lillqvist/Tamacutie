name: CritterCorner
options:
  bundleIdPrefix: se.lillqvist
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: sv
packages:
  CritterKit:
    path: CritterKit
settings:
  base:
    DEVELOPMENT_TEAM: CZJJ98747C
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
targets:
  CritterCorner:
    type: application
    platform: iOS
    sources:
      - CritterCorner
    dependencies:
      - package: CritterKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.lillqvist.crittercorner
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kryphörnan
        INFOPLIST_KEY_CFBundleDevelopmentRegion: sv
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  CritterCornerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CritterCornerTests
    dependencies:
      - target: CritterCorner
      - package: CritterKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: se.lillqvist.crittercorner.tests
  CritterCornerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CritterCornerUITests
    dependencies:
      - target: CritterCorner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: se.lillqvist.crittercorner.uitests
        TEST_TARGET_NAME: CritterCorner
schemes:
  CritterCorner:
    build:
      targets:
        CritterCorner: all
        CritterCornerTests: [test]
        CritterCornerUITests: [test]
    test:
      targets:
        - CritterCornerTests
        - CritterCornerUITests
